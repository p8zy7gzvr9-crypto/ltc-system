<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 1. 關鍵：設定手機縮放比例與防止縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>長照個案管理系統 V15.2</title>
    
    <!-- 2. PWA 與 iOS 優化標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="長照系統">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/4f46e5/ffffff?text=LTC">
    <meta name="theme-color" content="#4f46e5">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎樣式微調 */
        .card-horizontal { display: flex; align-items: center; gap: 1rem; }
        .warning-cooldown { border-left: 6px solid #fb923c; }
        .ready { border-left: 6px solid #4ade80; }
        .org-header { background: #334155; color: white; padding: 8px 15px; border-radius: 6px; margin: 25px 0 10px 0; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .area-header { background: #e2e8f0; color: #475569; padding: 4px 12px; border-radius: 4px; margin: 15px 0 5px 0; font-size: 0.875rem; font-weight: 800; border-left: 4px solid #94a3b8; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .code-badge { font-size: 1.4rem; font-weight: 900; } 
        .color-ca07 { color: #0ea5e9; } 
        .color-cb04 { color: #f472b6; }
        .info-stack-container { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .info-block { background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .label-icon { width: 20px; font-size: 0.9rem; }
        .text-content { font-size: 0.95rem; color: #334155; }
        .text-deadline { color: #64748b; font-size: 1.1rem; }
        .action-box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; border-radius: 8px; transition: all 0.2s; border: 1px solid #e2e8f0; }
        .editing-mode { border: 4px solid #ef4444 !important; background-color: #fff1f2 !important; }
        .last-open-box { background: #f1f5f9; padding: 4px 10px; border-radius: 8px; border: 1px dashed #cbd5e1; font-size: 0.7rem; color: #64748b; font-weight: 700; }
        .note-row { background: #fffbeb; border: 1px dashed #fcd34d; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; color: #92400e; margin-top: 4px; width: 100%; }
        .collapsed { display: none !important; }

        /* 3. 響應式側邊欄修正 */
        .sidebar-right { 
            width: 100%; 
            position: relative; 
            margin-top: 2rem; 
            background: white; 
            border: 2px solid #e2e8f0; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
        }
        
        @media (min-width: 1024px) {
            .sidebar-right { 
                width: 300px; 
                position: fixed; 
                right: 20px; 
                top: 100px; 
                bottom: 20px; 
                margin-top: 0;
            }
        }

        .sidebar-content { flex-grow: 1; overflow-y: auto; padding: 10px; }
        
        /* 防止手機左右晃動 */
        body { overflow-x: hidden; touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-100 p-4 pb-32">
    <!-- 4. 寬度自適應修正：手機不留白，大螢幕才留 340px 給側邊欄 -->
    <div class="max-w-7xl mx-auto lg:pr-[340px]">
        <div class="mb-4 flex flex-col md:flex-row justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-emerald-100 gap-2">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-black text-slate-800"> 長照系統 V15.2</h1>
                <div id="lastOpenDisplay" class="last-open-box">載入中...</div>
            </div>
            <div class="flex gap-2">
                <button onclick="exportJSON()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm"> 存檔備份</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm"> 還原資料</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
            </div>
        </div>

        <div id="inputForm" class="bg-white p-4 md:p-6 rounded-2xl shadow-xl border border-slate-200 mb-10 transition-all duration-300">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <select id="orgName" class="border p-2 rounded-lg w-full font-bold bg-amber-50">
                    <option value="行動">行動</option><option value="六月">六月</option><option value="大愛">大愛</option><option value="心禾">心禾</option>
                </select>
                <input id="name" type="text" placeholder="* 姓名" class="border p-2 rounded-lg w-full font-bold">
                <input id="phone" type="tel" placeholder="電話" class="border p-2 rounded-lg w-full">
                <input id="idNum" type="text" placeholder="身分證" class="border p-2 rounded-lg w-full">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 border-t pt-4">
                <div>
                    <label class="block text-xs text-gray-500 font-bold mb-1">照會日期</label>
                    <input id="startDate" type="text" placeholder="1150101" class="border p-2 rounded-lg w-full" oninput="autoCalcDeadline()">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs text-gray-500 font-bold mb-1">代碼/組數/週數</label>
                    <div class="flex gap-1">
                        <select id="codeType" class="border p-1 rounded-lg w-full text-xs" onchange="autoCalcDeadline()">
                            <option value="CA07">CA07</option><option value="CB04">CB04</option>
                        </select>
                        <select id="groupQty" class="border p-1 rounded-lg w-full text-xs" onchange="autoCalcDeadline()">
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                        </select>
                        <select id="weekCount" class="border p-1 rounded-lg w-full text-xs" onchange="autoCalcDeadline()">
                            <option value="0">0週</option>
                            <option value="4">4週</option>
                            <option value="8">8週</option>
                            <option value="12">12週</option>
                            <option value="16">16週</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 font-bold mb-1">預計結案日</label>
                    <input id="deadline" type="text" class="border p-2 rounded-lg w-full font-bold text-slate-700">
                </div>
                <div>
                    <label class="block text-xs text-blue-600 font-bold mb-1">已做幾次</label>
                    <select id="currentCount" class="border p-2 rounded-lg w-full bg-blue-50">
                        <option value="0">0次</option><option value="1">1次</option><option value="2">2次</option>
                    </select>
                </div>
                <div id="cooldownAdjustBlock" class="hidden">
                    <label class="block text-xs text-orange-600 font-bold mb-1">冷卻剩餘(天)</label>
                    <input id="manualCooldown" type="number" value="6" min="0" max="6" class="border p-2 rounded-lg w-full bg-orange-50 font-bold">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 font-bold mb-1">CMS 級別</label>
                    <select id="cmsLevel" class="border p-2 rounded-lg w-full">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option>
                    </select>
                </div>
            </div>
            <div class="mt-4"><input id="addressInput" type="text" placeholder="詳細地址" class="border p-2 rounded-lg w-full shadow-inner"></div>
            <div class="mt-4 flex flex-col md:flex-row gap-4">
                <input id="note" type="text" placeholder="備註..." class="border p-2 rounded-lg flex-grow">
                <button id="addBtn" onclick="savePatient()" class="bg-indigo-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">儲存個案</button>
                <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-slate-400 text-white px-4 py-3 rounded-xl font-bold">取消</button>
            </div>
        </div>
        <div id="mainDisplay" class="space-y-4"></div>
    </div>

    <!-- 側邊欄：手機上會自動排到下方 -->
    <div class="sidebar-right">
        <div class="p-3 bg-slate-700 text-white font-bold rounded-t-16 text-center"> 已結案清單</div>
        <div id="finishedDisplay" class="sidebar-content space-y-2"></div>
    </div>

    <script>
        /* 這裡放你原本的 JavaScript 邏輯，我僅調整排版結構 */
        // ... (保持你原本的 JS 代碼不變)
    </script>
</body>
</html>
