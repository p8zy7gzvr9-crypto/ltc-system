<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>長照個案管理系統 V15.2</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="長照系統">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/4f46e5/ffffff?text=LTC">
    <meta name="theme-color" content="#4f46e5">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-horizontal { display: flex; align-items: center; gap: 1rem; }
        .warning-cooldown { border-left: 6px solid #fb923c; }
        .ready { border-left: 6px solid #4ade80; }
        .org-header { background: #334155; color: white; padding: 8px 15px; border-radius: 6px; margin: 25px 0 10px 0; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .area-header { background: #e2e8f0; color: #475569; padding: 4px 12px; border-radius: 4px; margin: 15px 0 5px 0; font-size: 0.875rem; font-weight: 800; border-left: 4px solid #94a3b8; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .code-badge { font-size: 1.4rem; font-weight: 900; } 
        .info-block { background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .sidebar-right { width: 100%; position: relative; margin-top: 2rem; background: white; border: 2px solid #e2e8f0; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        @media (min-width: 1024px) { .sidebar-right { width: 300px; position: fixed; right: 20px; top: 100px; bottom: 20px; margin-top: 0; } }
        .sidebar-content { flex-grow: 1; overflow-y: auto; padding: 10px; }
        body { overflow-x: hidden; touch-action: manipulation; }
        .collapsed { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 p-4 pb-32">
    <div class="max-w-7xl mx-auto lg:pr-[340px]">
        <div class="mb-4 flex flex-col md:flex-row justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-emerald-100 gap-2">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-black text-slate-800"> 長照系統 V15.2</h1>
                <div id="lastOpenDisplay" class="last-open-box text-xs">上次開啟: --</div>
            </div>
            <div class="flex gap-2">
                <button onclick="exportJSON()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">存檔</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm">還原</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
            </div>
        </div>

        <div id="inputForm" class="bg-white p-4 rounded-2xl shadow-xl border border-slate-200 mb-6">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <select id="orgName" class="border p-2 rounded-lg font-bold bg-amber-50 text-sm">
                    <option value="行動">行動</option><option value="六月">六月</option><option value="大愛">大愛</option><option value="心禾">心禾</option>
                </select>
                <input id="name" type="text" placeholder="* 姓名" class="border p-2 rounded-lg font-bold text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <input id="phone" type="tel" placeholder="電話" class="border p-2 rounded-lg text-sm">
                <input id="idNum" type="text" placeholder="身分證" class="border p-2 rounded-lg text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3 border-t pt-3">
                <div>
                    <label class="block text-[10px] text-gray-500 font-bold">照會日(1150101)</label>
                    <input id="startDate" type="text" class="border p-2 rounded-lg w-full text-sm" oninput="autoCalcDeadline()">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 font-bold">預計結案日</label>
                    <input id="deadline" type="text" class="border p-2 rounded-lg w-full text-sm bg-gray-50" readonly>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-3">
                <select id="codeType" class="border p-2 rounded-lg text-xs" onchange="autoCalcDeadline()">
                    <option value="CA07">CA07</option><option value="CB04">CB04</option>
                </select>
                <select id="groupQty" class="border p-2 rounded-lg text-xs" onchange="autoCalcDeadline()">
                    <option value="1">1組</option><option value="2">2組</option><option value="3">3組</option>
                </select>
                <select id="weekCount" class="border p-2 rounded-lg text-xs" onchange="autoCalcDeadline()">
                    <option value="0">0週</option><option value="4">4週</option><option value="8">8週</option><option value="12">12週</option><option value="16">16週</option>
                </select>
            </div>
            <div class="mt-4 flex gap-2">
                <button onclick="savePatient()" class="flex-grow bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg">儲存個案</button>
                <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-slate-400 text-white px-4 py-3 rounded-xl font-bold">取消</button>
            </div>
        </div>

        <div id="mainDisplay" class="space-y-4"></div>
    </div>

    <div class="sidebar-right">
        <div class="p-3 bg-slate-700 text-white font-bold text-center">已結案清單</div>
        <div id="finishedDisplay" class="sidebar-content space-y-2"></div>
    </div>

    <script>
        let patients = JSON.parse(localStorage.getItem('ltc_patients')) || [];
        let editingId = null;

        function autoCalcDeadline() {
            const start = document.getElementById('startDate').value;
            const week = parseInt(document.getElementById('weekCount').value);
            if (start.length === 7) {
                let y = parseInt(start.substring(0, 3)) + 1911;
                let m = parseInt(start.substring(3, 5)) - 1;
                let d = parseInt(start.substring(5, 7));
                let date = new Date(y, m, d);
                date.setDate(date.getDate() + (week * 7));
                
                let ry = date.getFullYear() - 1911;
                let rm = String(date.getMonth() + 1).padStart(2, '0');
                let rd = String(date.getDate()).padStart(2, '0');
                document.getElementById('deadline').value = `${ry}${rm}${rd}`;
            }
        }

        function savePatient() {
            const name = document.getElementById('name').value;
            if (!name) return alert("請輸入姓名");

            const patient = {
                id: editingId || Date.now(),
                orgName: document.getElementById('orgName').value,
                name: name,
                startDate: document.getElementById('startDate').value,
                deadline: document.getElementById('deadline').value,
                codeType: document.getElementById('codeType').value,
                finished: false
            };

            if (editingId) {
                patients = patients.map(p => p.id === editingId ? patient : p);
                editingId = null;
                document.getElementById('addBtn') ? document.getElementById('addBtn').innerText = "儲存個案" : null;
            } else {
                patients.push(patient);
            }

            localStorage.setItem('ltc_patients', JSON.stringify(patients));
            render();
            clearForm();
        }

        function clearForm() {
            document.getElementById('name').value = "";
            document.getElementById('startDate').value = "";
            document.getElementById('deadline').value = "";
            editingId = null;
        }

        function render() {
            const container = document.getElementById('mainDisplay');
            container.innerHTML = "";
            patients.filter(p => !p.finished).forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl shadow border-l-8 border-indigo-500 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-lg">${p.name} <span class="text-xs text-gray-400">${p.orgName}</span></div>
                        <div class="text-sm text-gray-500">結案日: ${p.deadline}</div>
                    </div>
                    <button onclick="markFinished(${p.id})" class="bg-gray-100 p-2 rounded-lg text-xs">結案</button>
                `;
                container.appendChild(div);
            });
        }

        function markFinished(id) {
            patients = patients.map(p => p.id === id ? {...p, finished: true} : p);
            localStorage.setItem('ltc_patients', JSON.stringify(patients));
            render();
        }

        function exportJSON() {
            const data = JSON.stringify(patients);
            const blob = new Blob([data], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LTC_Backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        render();
    </script>
</body>
</html>
